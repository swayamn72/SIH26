services:
  muleguard:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: muleguard-app
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATA_DIR=/data
      - LOG_LEVEL=INFO
      - HOST=127.0.0.1
      - PORT=8000
    volumes:
      - ./data:/data
      - ./config:/app/config
      - ./backend/app:/app/backend/app
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  ollama_models:
