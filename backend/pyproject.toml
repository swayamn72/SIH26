[project]
name = "muleguard-local"
version = "0.1.0"
description = "Fully offline, explainable, formula-driven Mule-Account Detection System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0",
    "aiofiles>=23.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "camelot-py[cv]>=0.11.0",
    "pypdfium2>=4.0",
    "pytesseract>=0.3.10",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "chardet>=5.0",
    "charset-normalizer>=3.0",
    "rapidfuzz>=3.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "ollama>=0.1.0",
    "groq>=0.9.0",
    "pyyaml>=6.0",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
supervised = ["catboost>=1.2"]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
