ood:
  auto_proceed: 0.7
  low_confidence_upper: 0.7
  low_confidence_lower: 0.4
  hard_reject: 0.4
ood_weights:
  has_date_column: 0.2
  has_amount_columns: 0.2
  has_running_balance_column: 0.2
  has_bank_identity_markers: 0.15
  has_narration_column: 0.15
  row_count_plausible: 0.1
reconciliation:
  high_confidence_min: 0.98
  medium_confidence_min: 0.85
  tolerance: 0.01
header_classification:
  template_match_threshold: 0.85
  field_min_acceptance: 0.55
column_mapping:
  header_score_weight: 0.5
  content_score_weight: 0.5
categorization:
  fuzzy_match_threshold: 80
  counterparty_merge_threshold: 92
dormancy:
  gap_days: 30
  burst_min_transactions: 3
  burst_window_days: 3
behavior:
  midnight_hour_start: 22
  midnight_hour_end: 6
structuring:
  near_threshold_bands:
  - threshold: 50000
    lower_pct: 0.9
  - threshold: 200000
    lower_pct: 0.9
  round_number_moduli:
  - 1000
  - 10000
benford:
  significance_level: 0.95
cycle:
  max_cycle_length: 6
  dense_component_edge_cap: 1000
  min_cycle_risk_score: 0.6
bank_intelligence:
  flow_cycles:
    max_hops: 6
    min_hops: 3
    window_days: 10
    amount_tolerance: 0.25
    min_amount_percentile: 0.6
    max_cycles: 250
    max_expansions: 400000
    min_risk_score: 0.5
  max_rows: 250000
  max_banks_profiled: 500
  high_risk_tier_min: 45
  medium_risk_tier_min: 25
  near_threshold_bands:
  - threshold: 10000
    lower_pct: 0.9
  - threshold: 50000
    lower_pct: 0.9
  absolute_references:
    cycle_exposure: 0.1
    structuring_share: 0.15
    network_centrality: 0.25
    account_concentration: 0.5
    cross_currency_share: 0.4
    high_risk_format_share: 0.5
    burst_velocity: 0.25
  risk_weights:
    cycle_exposure: 0.24
    structuring_share: 0.18
    network_centrality: 0.16
    account_concentration: 0.14
    cross_currency_share: 0.12
    high_risk_format_share: 0.1
    burst_velocity: 0.06
pattern_timeline:
  layering_max_hold_days: 1
  layering_min_amount_match: 0.6
  structuring_min_transactions: 2
  min_pattern_risk: 0.5
  rapid_hop_hours: 24
  max_layering_chains: 10
  max_patterns: 25
cycle_risk_weights:
  amount_conservation: 0.35
  velocity_compression: 0.3
  cycle_recurrence: 0.2
  inverse_hop_count: 0.15
rules:
  R1_low_retention_high_turnover:
    points: 25
    condition: net_retention_ratio < 0.15 AND turnover_ratio > 8
  R2_dormancy_then_burst:
    points: 15
    condition: dormancy_breaks >= 1
  R3_structuring_near_threshold:
    points: 20
    condition: near_threshold_ratio > 0.3
  R4_benford_anomaly:
    points: 10
    condition: benford_deviation_score > critical_value_95
  R5_circular_flow_detected:
    points: 30
    condition: max_cycle_risk_score > 0.6
  R6_fan_in_fan_out:
    points: 20
    condition: fan_in_score > p90 AND net_retention_ratio < 0.2
fusion:
  supervised_available:
    rule_score: 0.4
    anomaly_score: 0.25
    supervised_probability: 0.35
  supervised_unavailable:
    rule_score: 0.65
    anomaly_score: 0.35
decision:
  confirmed_suspicious_min: 75
  likely_legitimate_max: 25
supervised:
  min_labeled_accounts: 200
anomaly:
  isolation_forest:
    n_estimators: 200
    random_state: 42
    contamination: auto
  robust_zscore_threshold: 3.5
file:
  max_size_mb: 50
  min_rows: 3
  min_columns: 3
