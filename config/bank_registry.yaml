# Institution reference data — offline, editable, no network lookups.
#
# ifsc_codes: the first four characters of an Indian IFSC identify the bank, so a
# narration carrying an IFSC (or a reference token prefixed with a bank code)
# identifies the counterparty institution exactly. Branch digits are deliberately
# discarded — bank-level is what the profile needs, and it keeps branch-level
# location out of the analysis.
ifsc_codes:
  SBIN: State Bank of India
  HDFC: HDFC Bank
  ICIC: ICICI Bank
  UTIB: Axis Bank
  PUNB: Punjab National Bank
  KKBK: Kotak Mahindra Bank
  YESB: Yes Bank
  IDIB: Indian Bank
  IOBA: Indian Overseas Bank
  CNRB: Canara Bank
  BARB: Bank of Baroda
  UBIN: Union Bank of India
  MAHB: Bank of Maharashtra
  BKID: Bank of India
  CBIN: Central Bank of India
  INDB: IndusInd Bank
  FDRL: Federal Bank
  RATN: RBL Bank
  IDFB: IDFC First Bank
  AUBL: AU Small Finance Bank
  UCBA: UCO Bank
  PSIB: Punjab & Sind Bank
  TMBL: Tamilnad Mercantile Bank
  KVBL: Karur Vysya Bank
  DCBL: DCB Bank
  SIBL: South Indian Bank
  CSBK: CSB Bank
  JAKA: Jammu & Kashmir Bank
  KARB: Karnataka Bank
  CIUB: City Union Bank
  BDBL: Bandhan Bank
  ESFB: Equitas Small Finance Bank
  UJVN: Ujjivan Small Finance Bank
  PYTM: Paytm Payments Bank
  AIRP: Airtel Payments Bank
